<!-- Action Button -->
@if (actionLabel) {
  <div class="page-actions">

    @if (actionLink) {
      <a class="btn btn-primary"
         [routerLink]="actionLink">

        @if (actionIcon) {
          <i class="bi {{ actionIcon }} me-2"></i>
        }

        {{ actionLabel }}

      </a>
    } @else {
      <button class="btn btn-primary">

        @if (actionIcon) {
          <i class="bi {{ actionIcon }} me-2"></i>
        }

        {{ actionLabel }}

      </button>
    }

  </div>
}
